name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Зависимости по pyproject.toml: pip подбирает версии mkdocs-material и pymdown-extensions,
      # совместимые с этой версией Python (закреплённые в requirements-docs.txt требуют 3.10+).
      - run: pip install -e .
      - run: make test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: make docs          # демо-сайт, mkdocs build --strict
