site_name: pugemon-mkdocs
site_description: Тема Pugemon для MkDocs Material — демо и подключение
site_url: https://pugemon.github.io/pugemon-mkdocs/
repo_url: https://github.com/pugemon/pugemon-mkdocs
repo_name: pugemon/pugemon-mkdocs
edit_uri: edit/main/docs/
copyright: "&copy; 2026 Vyacheslav Ivanov · BSD-3-Clause · сделано с мопсом"

theme:
  name: material
  language: ru
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

# Схемы, шрифты, знак, стили и страницу 404 добавляет плагин pugemon.
plugins:
  - search:
      lang: [ru, en]
  - pugemon

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.mark

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pugemon

nav:
  - Главная: index.md
  - Подключение: usage.md
  - Python: python.md
  - C++: cpp.md
  - Go: go.md
